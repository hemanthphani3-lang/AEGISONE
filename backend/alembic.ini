[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s

sqlalchemy.url = postgresql+asyncpg://accessguard:accessguard_pass@localhost:5432/accessguard_db

[loggers]
keys = root, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
